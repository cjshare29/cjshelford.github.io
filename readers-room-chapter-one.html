
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <title>Chapter One | Where Whispers Gather</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #080d18;
      color: #f2ead9;
      font-family: 'Libre Baskerville', serif;
      line-height: 1.5;
      overflow-x: hidden;
    }

    header {
      flex-shrink: 0;
      padding: 1rem 1rem 0.8rem;
      text-align: center;
      border-bottom: 1px solid rgba(201, 173, 114, 0.25);
    }

    header h1 {
      color: #c9ad72;
      font-family: 'Cinzel', serif;
      font-size: clamp(1.3rem, 3vw, 2rem);
      margin: 0 0 0.2rem;
    }

    header p {
      font-size: 0.85rem;
      font-style: italic;
      margin: 0;
    }

    .back-link {
      display: inline-block;
      margin-top: 0.5rem;
      color: #c9ad72;
      text-decoration: none;
      font-size: 0.8rem;
    }

    .back-link:hover,
    .back-link:focus-visible {
      text-decoration: underline;
    }

    main {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.6rem 1rem;
      gap: 0.5rem;
    }

    .chapter-intro {
      flex-shrink: 0;
      text-align: center;
    }

    .chapter-intro .ornament {
      color: #c9ad72;
      font-size: 1rem;
      line-height: 1.2;
    }

    .chapter-intro h2 {
      color: #c9ad72;
      font-family: 'Cinzel', serif;
      font-size: 1.25rem;
      font-weight: 400;
      margin: 0.1rem 0;
    }

    .chapter-intro p {
      font-size: 0.78rem;
      margin: 0;
    }

    /* Page display */

    .chapter-pages {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      line-height: 0;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
    }

    .chapter-pages img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      margin: 0 auto;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    /* Page navigation */

    .page-controls {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 0.4rem 0 0.2rem;
    }

    .page-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border: 1px solid #c9ad72;
      border-radius: 50%;
      background: transparent;
      color: #c9ad72;
      font-size: 1.5rem;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .page-arrow:hover:not(:disabled),
    .page-arrow:focus-visible:not(:disabled) {
      background: #c9ad72;
      color: #080d18;
    }

    .page-arrow:disabled {
      opacity: 0.25;
      cursor: default;
    }

    .page-count {
      min-width: 65px;
      color: #c9ad72;
      font-size: 0.8rem;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .chapter-note {
      flex-shrink: 0;
      text-align: center;
      font-size: 0.72rem;
      color: #c9ad72;
      margin: 0;
    }

    footer {
      flex-shrink: 0;
      text-align: center;
      padding: 0.6rem 1rem;
      border-top: 1px solid rgba(201, 173, 114, 0.25);
      font-size: 0.72rem;
      color: #c9ad72;
    }

    @media (max-width: 600px) {
      header {
        padding: 0.7rem 0.5rem;
      }

      header h1 {
        font-size: 1.3rem;
      }

      header p {
        font-size: 0.75rem;
      }

      main {
        padding: 0.4rem 0.5rem;
        gap: 0.35rem;
      }

      .chapter-intro h2 {
        font-size: 1.05rem;
      }

      .chapter-intro p {
        font-size: 0.7rem;
      }

      .page-controls {
        gap: 1rem;
      }

      .page-arrow {
        width: 38px;
        height: 38px;
      }

      .chapter-note {
        font-size: 0.65rem;
      }

      footer {
        padding: 0.45rem;
        font-size: 0.65rem;
      }
    }

    @media (max-height: 650px) {
      header {
        padding: 0.4rem;
      }

      header h1 {
        font-size: 1.2rem;
      }

      .back-link {
        margin-top: 0.2rem;
      }

      main {
        padding: 0.3rem;
        gap: 0.25rem;
      }

      .chapter-intro .ornament {
        display: none;
      }

      .chapter-intro h2 {
        font-size: 1rem;
      }

      .page-arrow {
        width: 34px;
        height: 34px;
      }

      footer {
        padding: 0.3rem;
      }
    }
  </style>
</head>

<body oncontextmenu="return false;">

  <header>
    <h1>Where Whispers Gather</h1>
    <p>The Whispered Realms — Book One</p>

    <a class="back-link" href="../sneak-peek/">
      &larr; Back to the Readers Room
    </a>
  </header>

  <main>

    <section class="chapter-intro">
      <div class="ornament" aria-hidden="true">&#10022;</div>
      <h2>Chapter One</h2>
      <p>Your first glimpse into the Whispered Realms begins here.</p>
    </section>

    <section class="chapter-pages"
             aria-label="Chapter One page viewer">

      <img
        id="chapterPage"
        src="../chapter 1 images/chapter 1 images.1.jpeg"
        alt="Where Whispers Gather, Chapter One, page 1"
        draggable="false">

    </section>

    <div class="page-controls" aria-label="Chapter page navigation">

      <button
        class="page-arrow"
        id="previousPage"
        type="button"
        aria-label="Previous page"
        disabled>
        &#8592;
      </button>

      <span class="page-count" id="pageCount" aria-live="polite">
        1 / 7
      </span>

      <button
        class="page-arrow"
        id="nextPage"
        type="button"
        aria-label="Next page">
        &#8594;
      </button>

    </div>

    <p class="chapter-note">
      Thank you for being part of the journey into the Whispered Realms.
    </p>

  </main>

  <footer>
    &copy; C. J. Shelford | Crystal Quartz Press
  </footer>

  <script>
    const pages = [
      "../chapter 1 images/chapter 1 images.1.jpeg",
      "../chapter 1 images/chapter 1 images.2.jpeg",
      "../chapter 1 images/chapter 1 images.3.jpeg",
      "../chapter 1 images/chapter 1 images.4.jpeg",
      "../chapter 1 images/chapter 1 images.5.jpeg",
      "../chapter 1 images/chapter 1 images.6.jpeg",
      "../chapter 1 images/chapter 1 images.7.jpeg"
    ];

    let currentPage = 0;

    const pageImage = document.getElementById("chapterPage");
    const pageCount = document.getElementById("pageCount");
    const previousButton = document.getElementById("previousPage");
    const nextButton = document.getElementById("nextPage");

    function showPage(pageIndex) {
      currentPage = pageIndex;

      pageImage.src = pages[currentPage];
      pageImage.alt =
        "Where Whispers Gather, Chapter One, page " +
        (currentPage + 1);

      pageCount.textContent =
        (currentPage + 1) + " / " + pages.length;

      previousButton.disabled = currentPage === 0;
      nextButton.disabled = currentPage === pages.length - 1;
    }

    previousButton.addEventListener("click", function () {
      if (currentPage > 0) {
        showPage(currentPage - 1);
      }
    });

    nextButton.addEventListener("click", function () {
      if (currentPage < pages.length - 1) {
        showPage(currentPage + 1);
      }
    });

    // Allow readers to use the left and right arrow keys.
    document.addEventListener("keydown", function (event) {
      if (event.key === "ArrowRight" && currentPage < pages.length - 1) {
        showPage(currentPage + 1);
      }

      if (event.key === "ArrowLeft" && currentPage > 0) {
        showPage(currentPage - 1);
      }
    });

    // Deter ordinary dragging, copying and right-clicking.
    document.addEventListener("contextmenu", function (event) {
      event.preventDefault();
    });

    document.addEventListener("dragstart", function (event) {
      event.preventDefault();
    });

    document.addEventListener("copy", function (event) {
      event.preventDefault();
    });

    document.addEventListener("cut", function (event) {
      event.preventDefault();
    });
  </script>

</body>
</html>
