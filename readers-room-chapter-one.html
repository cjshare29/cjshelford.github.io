
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <title>Chapter One | Where Whispers Gather</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080d18;
      color: #f2ead9;
      font-family: 'Libre Baskerville', serif;
      line-height: 1.7;
    }

    header {
      padding: 2rem 1rem 1.5rem;
      text-align: center;
      border-bottom: 1px solid rgba(201, 173, 114, 0.25);
    }

    header h1 {
      color: #c9ad72;
      font-family: 'Cinzel', serif;
      font-size: clamp(1.5rem, 4vw, 2.3rem);
      margin: 0 0 0.4rem;
    }

    header p {
      font-style: italic;
      margin: 0;
    }

    .back-link {
      display: inline-block;
      margin-top: 1rem;
      color: #c9ad72;
      text-decoration: none;
      font-size: 0.85rem;
    }

    .back-link:hover,
    .back-link:focus-visible {
      text-decoration: underline;
    }

    main {
      width: min(900px, 94%);
      margin: 2rem auto 3rem;
    }

    .chapter-intro {
      text-align: center;
      margin-bottom: 2rem;
    }

    .chapter-intro .ornament {
      color: #c9ad72;
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .chapter-intro h2 {
      color: #c9ad72;
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      font-weight: 400;
      margin: 0.3rem 0 0.8rem;
    }

    .chapter-intro p {
      font-size: 0.9rem;
    }

    /* Chapter page images */

    .chapter-pages {
      max-width: 760px;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
      border: 1px solid rgba(201, 173, 114, 0.5);
      border-radius: 3px;
      line-height: 0;

      /* Deters ordinary text selection */
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
    }

    .chapter-pages img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    .chapter-note {
      max-width: 760px;
      margin: 1.5rem auto 0;
      text-align: center;
      font-size: 0.8rem;
      color: #c9ad72;
    }

    footer {
      text-align: center;
      padding: 1.5rem 1rem 2rem;
      border-top: 1px solid rgba(201, 173, 114, 0.25);
      font-size: 0.8rem;
      color: #c9ad72;
    }

    @media (max-width: 600px) {
      header {
        padding: 1.5rem 1rem;
      }

      main {
        width: 96%;
        margin-top: 1.5rem;
      }

      .chapter-intro h2 {
        font-size: 1.2rem;
      }

      .chapter-intro p {
        font-size: 0.82rem;
      }
    }

    @media print {
      body {
        background: #fff;
        color: #000;
      }

      header,
      footer,
      .chapter-note {
        display: none;
      }
    }
  </style>
</head>

<body oncontextmenu="return false;">

  <header>
    <h1>Where Whispers Gather</h1>
    <p>The Four Realms — Book One</p>

    <a class="back-link" href="../sneak-peek/">
      &larr; Back to the Readers Room
    </a>
  </header>

  <main>
    <section class="chapter-intro">
      <div class="ornament" aria-hidden="true">&#10022;</div>

      <h2>Chapter One</h2>

      <p>Your first glimpse into the Four Realms begins here.</p>
    </section>

    <section class="chapter-pages"
             aria-label="Chapter One pages"
             oncontextmenu="return false;">

      <img
        src="chapter-one-page-1.jpg"
        alt="Where Whispers Gather, Chapter One, page 1"
        draggable="false">

      <!-- Copy an image element for every remaining page.
           Update the filename and alt text for each page. -->

    </section>

    <p class="chapter-note">
      Thank you for being part of the journey into the Four Realms.
    </p>
  </main>

  <footer>
    &copy; C. J. Shelford | Crystal Quartz Press
  </footer>

  <script>
    // Deters common casual copying actions.
    document.addEventListener('contextmenu', function (event) {
      event.preventDefault();
    });

    document.addEventListener('dragstart', function (event) {
      event.preventDefault();
    });

    document.addEventListener('copy', function (event) {
      event.preventDefault();
    });

    document.addEventListener('cut', function (event) {
      event.preventDefault();
    });
  </script>

</body>
</html>
